# -----------------------------------------------------------------
#  Default server + the data plane internal API
# -----------------------------------------------------------------

# Requests for a domain that has not been configured in MosWAF
server {
    listen      80  default_server;
    listen      443 ssl default_server;
    http2       on;
    server_name _;

    ssl_certificate     /usr/local/moswaf/ssl/default.crt;
    ssl_certificate_key /usr/local/moswaf/ssl/default.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve ACME challenges for sites that do not have a certificate yet
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>MosWAF</title>
<style>body{background:#0b0e14;color:#c9d1d9;font:15px/1.6 system-ui,sans-serif;display:flex;
height:100vh;align-items:center;justify-content:center;margin:0}.b{text-align:center}
.t{font-size:22px;font-weight:600;color:#e6edf3}.s{color:#8b949e;margin-top:8px;font-size:13px}</style>
</head><body><div class="b"><div class="t">MosWAF</div>
<div class="s">This domain is not configured on this server.</div></div></body></html>';
    }
}

# Internal API: only reachable inside the docker network, never published
server {
    listen 8081;
    server_name _;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location = /healthz {
        content_by_lua_block { require("moswaf.api").healthz() }
    }

    location = /metrics {
        content_by_lua_block { require("moswaf.api").metrics() }
    }

    # Force an immediate config sync (the control plane calls this after saving)
    location = /sync {
        content_by_lua_block { require("moswaf.api").sync() }
    }

    # Temporary bans only live in the data plane memory, so they are read and lifted here
    location = /bans {
        content_by_lua_block { require("moswaf.api").bans() }
    }

    location = /unban {
        content_by_lua_block { require("moswaf.api").unban() }
    }
}
