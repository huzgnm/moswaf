# -----------------------------------------------------------------
#  Server mac dinh + API noi bo cua data plane
# -----------------------------------------------------------------

# Request toi domain chua duoc khai bao trong MosWAF
server {
    listen      80  default_server;
    listen      443 ssl default_server;
    http2       on;
    server_name _;

    ssl_certificate     /usr/local/moswaf/ssl/default.crt;
    ssl_certificate_key /usr/local/moswaf/ssl/default.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Nhan song ACME cho site chua co chung chi
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>MosWAF</title>
<style>body{background:#0b0e14;color:#c9d1d9;font:15px/1.6 system-ui,sans-serif;display:flex;
height:100vh;align-items:center;justify-content:center;margin:0}.b{text-align:center}
.t{font-size:22px;font-weight:600;color:#e6edf3}.s{color:#8b949e;margin-top:8px;font-size:13px}</style>
</head><body><div class="b"><div class="t">MosWAF</div>
<div class="s">Ten mien nay chua duoc cau hinh tren he thong.</div></div></body></html>';
    }
}

# API noi bo: chi mo trong mang docker, khong publish ra ngoai
server {
    listen 8081;
    server_name _;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location = /healthz {
        content_by_lua_block { require("moswaf.api").healthz() }
    }

    location = /metrics {
        content_by_lua_block { require("moswaf.api").metrics() }
    }

    # Ep dong bo cau hinh ngay lap tuc (control plane goi sau khi luu thay doi)
    location = /sync {
        content_by_lua_block { require("moswaf.api").sync() }
    }
}
