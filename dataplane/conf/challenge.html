<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Checking your browser</title>
<!--
  Self-contained for the same reason as the block page. No percentage anywhere:
  the work is memoryless, so a bar filling toward 2^N would be an animation
  impersonating knowledge nobody has. Shown instead is what is known - that work
  is happening, how much has been tried, how long it has taken.
-->
<style>
  :root{
    --bg:#fbfcfd; --surface:#fff;
    --line:#e7ebef; --line-2:#dde3e9;
    --ink:#0a0a0a; --ink-2:#4c5967; --ink-3:#6b7885;
    --good:#1f9d68; --warn:#a8701a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100%;
  }
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}

  header{
    border-bottom:1px solid var(--line);background:var(--surface);
    padding:16px 32px;display:flex;align-items:center;gap:10px;
  }
  header svg.mark{width:22px;height:22px;color:var(--ink);flex:none}
  header .name{font-size:15px;font-weight:700;letter-spacing:-.02em}
  header .status{margin-left:auto}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 32px}
  .wrap{
    width:100%;max-width:1000px;
    display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;align-items:center;
  }

  h1{font-size:36px;line-height:1.14;letter-spacing:-.035em;font-weight:600;margin:14px 0 0}
  .say{color:var(--ink-2);font-size:15px;margin:16px 0 0;max-width:48ch}

  /* The status panel. A fixed floor so nothing on the page moves when the
     state changes - a layout that jumps at the moment of success reads as a
     fault, not as progress. */
  .panel{
    border:1px solid var(--line);background:var(--surface);border-radius:4px;
    padding:22px;display:flex;flex-direction:column;justify-content:center;
    /* Tall enough for the state that needs the most room - the one with the
       retry button - so the panel is the same size in all three and nothing
       resizes at the moment the check ends. */
    min-height:224px;
  }
  .panel h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
            color:var(--ink-3);font-weight:500;margin:0 0 16px}

  /* Indeterminate: a segment that travels, with no start and no end position
     that could be read as an amount completed. */
  .track{height:3px;background:var(--line);overflow:hidden;position:relative}
  .track span{
    position:absolute;top:0;bottom:0;left:0;width:34%;background:var(--ink);
    animation:sweep 1.5s cubic-bezier(.45,0,.35,1) infinite;
  }
  @keyframes sweep{0%{left:-34%}100%{left:100%}}

  .state{margin:16px 0 0;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:9px}
  .state svg{width:16px;height:16px;flex:none}
  .metrics{margin:8px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
           font-variant-numeric:tabular-nums;min-height:18px}

  .retry{
    margin-top:16px;min-height:42px;width:100%;
    display:none;align-items:center;justify-content:center;gap:8px;
    font:500 13px/1.2 var(--sans);color:#fafafa;background:#171717;
    border:1px solid #171717;border-radius:2px;cursor:pointer;padding:10px 14px;
  }
  .retry:hover{background:#000}
  .retry:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

  /* State switching. Only the panel changes; the page around it does not. */
  body[data-state="done"] .track span{animation:none;left:0;width:100%;background:var(--good)}
  body[data-state="done"] .state{color:var(--good)}
  body[data-state="stalled"] .track span{animation:none;left:0;width:100%;background:var(--warn);opacity:.35}
  body[data-state="stalled"] .retry{display:inline-flex}
  body[data-state="stalled"] .metrics{color:var(--ink-2)}

  .ico-done,.ico-wait,.ico-stall{display:none}
  body[data-state="working"] .ico-wait{display:block}
  body[data-state="done"] .ico-done{display:block;color:var(--good)}
  body[data-state="stalled"] .ico-stall{display:block;color:var(--warn)}

  footer{border-top:1px solid var(--line);padding:16px 32px;background:var(--surface)}
  footer p{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
           text-transform:uppercase;color:var(--ink-3)}

  .nojs{
    border:1px solid var(--line-2);border-left:2px solid var(--warn);background:var(--surface);
    padding:16px 18px;margin:20px 0 0;max-width:48ch;font-size:14px;color:var(--ink-2);border-radius:2px;
  }
  .nojs b{color:var(--ink);font-weight:600}

  /* Narrow: a full-screen wait, one column, the status near the top of the
     fold rather than beside the text. Nothing is scaled down from the desktop
     arrangement - the panel simply follows the message. */
  @media (max-width:860px){
    header{padding:14px 18px}
    /* Stays centred on a phone: this is a screen somebody waits on, and the
       content is short enough that pinning it to the top leaves the wait
       floating above half a screen of nothing. */
    main{padding:28px 18px 36px}
    .wrap{display:block;max-width:520px;margin:0 auto}
    h1{font-size:26px;margin:0}
    .say{font-size:14.5px;margin-top:12px}
    .panel{margin-top:22px;padding:18px;min-height:0}
    .panel h2{margin-bottom:14px}
    .retry{min-height:46px;font-size:14px}
    footer{padding:14px 18px}
  }
  @media (max-width:380px){h1{font-size:23px}.say{font-size:14px}}

  /* The travelling segment is motion for its own sake to anyone who has asked
     for less of it. The counters below carry the same information. */
  @media (prefers-reduced-motion:reduce){
    .track span{animation:none;left:0;width:100%;background:var(--line-2)}
    body[data-state="done"] .track span{background:var(--good)}
    *{transition:none!important}
  }
</style>
</head>
<body data-state="working">

<header>
  <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M16 3l10.5 3.8v7.9c0 6.3-4.4 11.1-10.5 12.8C9.9 25.8 5.5 21 5.5 14.7V6.8L16 3z"
          stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M9.4 17.6c2-2.2 3.7-1.1 4.9.4 1.3 1.7 2.6 1.8 3.9-.2 1.2-1.7 2.8-2 4.6-.5"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>
  </svg>
  <span class="name">MosWAF</span>
  <span class="eyebrow status">HTTP 503</span>
</header>

<main>
  <div class="wrap">
    <div>
      <p class="eyebrow">Automatic check</p>
      <h1>Checking your browser</h1>
      <p class="say">This happens by itself and usually takes a few seconds. Keep this tab open - the page continues on its own as soon as the check finishes.</p>

      <noscript>
        <div class="nojs">
          <b>This check needs JavaScript.</b> Your browser has it switched off, so the check cannot run. Enable JavaScript for this site and reload the page.
        </div>
      </noscript>
    </div>

    <section class="panel" aria-label="Verification status">
      <h2>Status</h2>

      <div class="track" aria-hidden="true"><span></span></div>

      <p class="state">
        <svg class="ico-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" opacity=".9"/>
        </svg>
        <svg class="ico-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <svg class="ico-stall" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2"/>
        </svg>
        <span id="live" role="status" aria-live="polite">Checking your browser</span>
      </p>

      <p class="metrics" id="metrics" aria-hidden="true">Starting</p>

      <button type="button" class="retry" id="retry">Try again</button>
    </section>
  </div>
</main>

<footer><p>Protected by MosWAF</p></footer>

<script>
(function () {
  var SALT = "{{SALT}}", SIG = "{{SIG}}", BITS = parseInt("{{BITS}}", 10) || 16,
      RET = "{{RET}}", VERIFY = "{{VERIFY}}";

  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  function rr(x, n) { return (x >>> n) | (x << (32 - n)); }

  // SHA-256 over an ASCII string, returns eight 32-bit words
  function sha256(str) {
    var i, j, bytes = [];
    for (i = 0; i < str.length; i++) bytes.push(str.charCodeAt(i) & 0xff);
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0,
      (bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);

    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var w = new Array(64);

    for (i = 0; i < bytes.length; i += 64) {
      for (j = 0; j < 16; j++) {
        w[j] = (bytes[i + 4*j] << 24) | (bytes[i + 4*j + 1] << 16) |
               (bytes[i + 4*j + 2] << 8) | bytes[i + 4*j + 3];
      }
      for (j = 16; j < 64; j++) {
        var x = w[j-15], y = w[j-2];
        var s0 = rr(x,7) ^ rr(x,18) ^ (x >>> 3);
        var s1 = rr(y,17) ^ rr(y,19) ^ (y >>> 10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (j = 0; j < 64; j++) {
        var S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
        var ch = (e & f) ^ ((~e) & g);
        var t1 = (h + S1 + ch + K[j] + w[j]) | 0;
        var S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
        var mj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + mj) | 0;
        h=g; g=f; f=e; e=(d + t1)|0; d=c; c=b; b=a; a=(t1 + t2)|0;
      }
      H = [(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
    }
    return H;
  }

  function leadingZeroBits(H) {
    var n = 0;
    for (var i = 0; i < 8; i++) {
      var v = H[i] >>> 0;
      if (v === 0) { n += 32; continue; }
      var c = 0, m = 0x80000000;
      while (m && (v & m) === 0) { c++; m >>>= 1; }
      return n + c;
    }
    return n;
  }

  var live = document.getElementById("live"),
      metrics = document.getElementById("metrics"),
      retry = document.getElementById("retry"),
      nonce = 0, started = Date.now(), CHUNK = 4000;

  // The salt the server issued is good for two minutes; a solution presented
  // after that is refused as expired. So the page stops a little before then
  // rather than spending a slow phone's battery on work that cannot be
  // redeemed - and reloading asks for a fresh one, which is why the button is
  // offered only here and does nothing clever.
  var DEADLINE = 110000;

  function setState(s) { document.body.setAttribute("data-state", s); }

  function done(n) {
    setState("done");
    live.textContent = "Verified - taking you to the site";
    metrics.textContent = fmt(nonce) + " hashes in " + secs() + "s";
    var url = VERIFY + "?s=" + encodeURIComponent(SALT) +
              "&g=" + encodeURIComponent(SIG) +
              "&n=" + encodeURIComponent(String(n)) +
              "&r=" + encodeURIComponent(RET);
    setTimeout(function () { window.location.replace(url); }, 450);
  }

  function stalled() {
    setState("stalled");
    live.textContent = "This is taking longer than usual";
    metrics.textContent = "Stopped after " + secs() + "s - the check has to start again";
    retry.focus();
  }

  function secs() { return ((Date.now() - started) / 1000).toFixed(1); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function work() {
    var end = nonce + CHUNK;
    for (; nonce < end; nonce++) {
      if (leadingZeroBits(sha256(SALT + nonce)) >= BITS) { done(nonce); return; }
    }
    if (Date.now() - started > DEADLINE) { stalled(); return; }
    // Counted, not estimated: how much has been tried and how long it took.
    // Neither says how much is left, because nothing does.
    metrics.textContent = fmt(nonce) + " hashes - " + secs() + "s";
    setTimeout(work, 0);
  }

  retry.addEventListener("click", function () { window.location.reload(); });
  setTimeout(work, 30);
})();
</script>
</body>
</html>
