<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Request blocked</title>
<style>
  :root{--bg:#0b0e14;--card:#11161f;--line:#1f2733;--fg:#e6edf3;--mut:#8b949e;--red:#f87171}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{width:min(92vw,480px);background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .logo{font-size:13px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin-bottom:18px}
  .logo b{color:#3b82f6}
  h1{font-size:19px;margin:0 0 10px;font-weight:600;color:var(--red)}
  p{margin:0 0 18px;color:var(--mut);font-size:13.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:7px 0;border-top:1px solid var(--line);color:var(--mut)}
  td:last-child{text-align:right;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  footer{margin-top:20px;font-size:11.5px;color:#4b5563;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Mos<b>WAF</b></div>
  <h1>Your request was blocked</h1>
  <p>The firewall determined that this request violates the site's security policy.
     If you believe this is a mistake, send the event id below to the site administrator.</p>
  <table>
    <tr><td>Event id</td><td>{{RAY}}</td></tr>
    <tr><td>IP address</td><td>{{IP}}</td></tr>
    <tr><td>Reason</td><td>{{REASON}}</td></tr>
    <tr><td>Time</td><td>{{TIME}}</td></tr>
  </table>
  <footer>Protected by MosWAF</footer>
</div>
</body>
</html>
