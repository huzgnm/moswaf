# =================================================================
#  MosWAF - data plane (OpenResty)
#  The entrypoint copies this file into /usr/local/openresty/nginx/conf/
#  and substitutes __LOG_LEVEL__ with MOSWAF_LOG_LEVEL at startup.
# =================================================================

user                 root;
worker_processes     auto;
worker_rlimit_nofile 65535;
pid                  /run/nginx.pid;

error_log /var/log/moswaf/error.log __LOG_LEVEL__;

# Environment variables the Lua code reads with os.getenv
env MOSWAF_REDIS_HOST;
env MOSWAF_REDIS_PORT;
env MOSWAF_REDIS_PASSWORD;
env MOSWAF_CHALLENGE_SECRET;
env MOSWAF_CONF_DIR;
env MOSWAF_INTERNAL_TOKEN;

events {
    worker_connections 20480;
    multi_accept       on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # MosWAF writes its own log from Lua, so nginx access_log is off to save IO
    access_log off;

    server_tokens off;
    more_clear_headers 'Server';
    more_set_headers   'Server: MosWAF';

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # --- slowloris and slow POST protection at the nginx layer ---
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                20s;
    keepalive_timeout           30s;
    keepalive_requests          500;
    reset_timedout_connection   on;
    client_max_body_size        64m;
    client_body_buffer_size     256k;
    large_client_header_buffers 4 16k;

    # --- coarse defence, rejecting before any CPU is spent in Lua ---
    limit_conn_zone   $binary_remote_addr zone=moswaf_conn:20m;
    limit_req_zone    $binary_remote_addr zone=moswaf_hard:20m rate=200r/s;
    limit_conn_status 429;
    limit_req_status  429;

    # --- engine shared memory ---
    lua_shared_dict moswaf_conf   16m;   # configuration snapshot from the control plane
    lua_shared_dict moswaf_cnt    64m;   # rate limit counters
    lua_shared_dict moswaf_ban    32m;   # temporary per-IP bans
    lua_shared_dict moswaf_stats   8m;   # per-minute statistics
    lua_shared_dict moswaf_locks   1m;

    lua_package_path "/usr/local/moswaf/lua/?.lua;/usr/local/moswaf/lua/?/init.lua;;";
    lua_code_cache   on;
    resolver         127.0.0.11 ipv6=off valid=30s;

    init_by_lua_block        { require("moswaf.init").init() }
    init_worker_by_lua_block { require("moswaf.init").init_worker() }

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;
    proxy_buffers         8 32k;
    proxy_busy_buffers_size 64k;
    proxy_next_upstream   error timeout http_502 http_503 http_504;

    gzip            on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # default server and internal endpoints
    include /usr/local/moswaf/conf/default.conf;

    # sites generated by the control plane
    include /etc/moswaf/sites/*.conf;
}
