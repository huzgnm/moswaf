name: moswaf

services:
  # ------------------------------------------------------------------
  # Postgres - source of truth for the config, the rules and the attack log
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: moswaf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - ${MOSWAF_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [moswaf]

  # ------------------------------------------------------------------
  # Redis - config bus (control -> proxy) and event queue (proxy -> control)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: moswaf-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [moswaf]

  # ------------------------------------------------------------------
  # Control plane - REST API and admin dashboard (ON ITS OWN PORT)
  # ------------------------------------------------------------------
  mgmt:
    build:
      context: .
      dockerfile: control/Dockerfile
    image: moswaf/mgmt:${MOSWAF_VERSION:-0.1.0}
    container_name: moswaf-mgmt
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MOSWAF_LISTEN: ":9443"
      MOSWAF_DB_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      MOSWAF_REDIS_ADDR: "redis:6379"
      MOSWAF_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MOSWAF_JWT_SECRET: ${MOSWAF_JWT_SECRET}
      MOSWAF_CHALLENGE_SECRET: ${MOSWAF_CHALLENGE_SECRET}
      MOSWAF_INTERNAL_TOKEN: ${MOSWAF_INTERNAL_TOKEN:-}
      MOSWAF_ADMIN_USER: ${MOSWAF_ADMIN_USER:-admin}
      MOSWAF_ADMIN_PASSWORD: ${MOSWAF_ADMIN_PASSWORD}
      MOSWAF_SITES_DIR: /etc/moswaf/sites
      MOSWAF_CERTS_DIR: /etc/moswaf/certs
      TZ: ${TZ:-UTC}
    volumes:
      - moswaf-sites:/etc/moswaf/sites
      - moswaf-certs:/etc/moswaf/certs
      - ${MOSWAF_DATA_DIR:-./data}/admin-tls:/etc/moswaf/admin-tls
    ports:
      # The admin dashboard sits on its own port, fully separate from 80/443
      - "${MOSWAF_ADMIN_BIND:-0.0.0.0}:${MOSWAF_ADMIN_PORT:-9443}:9443"
    networks: [moswaf]

  # ------------------------------------------------------------------
  # Data plane - OpenResty: takes all traffic on 80/443 and filters it at layer 7
  # ------------------------------------------------------------------
  proxy:
    build:
      context: .
      dockerfile: dataplane/Dockerfile
    image: moswaf/proxy:${MOSWAF_VERSION:-0.1.0}
    container_name: moswaf-proxy
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment:
      MOSWAF_REDIS_HOST: redis
      MOSWAF_REDIS_PORT: "6379"
      MOSWAF_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MOSWAF_CHALLENGE_SECRET: ${MOSWAF_CHALLENGE_SECRET}
      MOSWAF_INTERNAL_TOKEN: ${MOSWAF_INTERNAL_TOKEN:-}
      MOSWAF_LOG_LEVEL: ${MOSWAF_LOG_LEVEL:-warn}
      TZ: ${TZ:-UTC}
    volumes:
      - moswaf-sites:/etc/moswaf/sites:ro
      - moswaf-certs:/etc/moswaf/certs:ro
      - ${MOSWAF_DATA_DIR:-./data}/proxy-logs:/var/log/moswaf
    ports:
      - "${MOSWAF_HTTP_PORT:-80}:80"
      - "${MOSWAF_HTTPS_PORT:-443}:443"
    extra_hosts:
      # Lets a site point its upstream at the host running MosWAF
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    networks: [moswaf]

volumes:
  moswaf-sites:
  moswaf-certs:

networks:
  moswaf:
    driver: bridge
